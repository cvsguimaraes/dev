<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scroll Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overscroll-behavior: none; /* Disable elastic/bounce scrolling */
            -webkit-overflow-scrolling: touch;
        }

        body {
            width: 100%;
            height: 300vh; /* 3x viewport height for scroll */
            overflow-x: hidden;
            background: #000;
            overscroll-behavior: none; /* Disable overscroll bounce */
        }

        #canvas-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: calc(100vh + 120px); /* Overscan: add extra height for address bar toggle */
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        #scroll-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 10px;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 1000;
        }

        #loading.hidden {
            display: none;
        }

        /* Scroll indicator */
        #scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="loading">Loading frames...</div>

    <div id="canvas-container">
        <canvas id="scroll-canvas"></canvas>
    </div>

    <div id="scroll-indicator">Scroll: 0% | Frame: 1/96</div>

    <script>
        const canvas = document.getElementById('scroll-canvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('scroll-indicator');
        const loading = document.getElementById('loading');

        // Configuration
        const frameCount = 96;
        const images = [];
        let imagesLoaded = 0;
        let currentFrame = -1; // Start at -1 so first frame (0) will render

        // Set canvas size to match video dimensions
        canvas.width = 1080;
        canvas.height = 1920;

        // Preload all images
        function preloadImages() {
            const cacheBuster = Date.now(); // One-time cache buster
            for (let i = 1; i <= frameCount; i++) {
                const img = new Image();
                img.onload = () => {
                    imagesLoaded++;
                    loading.textContent = `Loading frames... ${imagesLoaded}/${frameCount}`;

                    // Render first frame as soon as it loads
                    if (imagesLoaded === 1) {
                        render(); // Show first frame immediately
                    }

                    if (imagesLoaded === frameCount) {
                        loading.classList.add('hidden');
                    }
                };
                img.src = `frames/sequence/frame_${String(i).padStart(4, '0')}.jpg?v=${cacheBuster}`;
                images.push(img);
            }
        }

        // Calculate current frame based on scroll
        let scrollProgress = 0;

        function updateScrollProgress() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = Math.min(Math.max(scrollTop / scrollHeight, 0), 1);
        }

        // Render current frame
        function render() {
            const frameIndex = Math.min(
                Math.floor(scrollProgress * frameCount),
                frameCount - 1
            );

            if (frameIndex !== currentFrame && images[frameIndex] && images[frameIndex].complete) {
                currentFrame = frameIndex;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(images[frameIndex], 0, 0, canvas.width, canvas.height);

                // Update indicator
                indicator.textContent = `Scroll: ${Math.round(scrollProgress * 100)}% | Frame: ${currentFrame + 1}/${frameCount}`;
            }
        }

        // Use requestAnimationFrame for smooth updates
        function animate() {
            updateScrollProgress();
            render();
            requestAnimationFrame(animate);
        }

        // Start loading and animation
        preloadImages();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
